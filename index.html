<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <link rel="stylesheet" href="./dist/output.css">

  <title>Frontend Mentor | Base Apparel coming soon page</title>
</head>

<body class="font-josefin antialiased m-0 bg-pink-400">

  <main class="min-h-screen md:flex md:h-screen md:overflow-hidden">

    <div class="relative bg-gradient-1 md:w-7/12 md:flex md:flex-col md:overflow-y-auto">

      <img class="hidden md:block absolute inset-0 z-0 w-full h-full object-cover object-center"
      src="images/bg-pattern-desktop.svg" alt="">

      <div class="relative z-10 p-8 md:pt-16 md:px-20 w-full max-w-xl mx-auto">
        <img src="images/logo.svg" alt="base apparel logo" class="w-24 md:w-40">
      </div>

      <div class="md:hidden relative z-10">
        <img src="images/hero-mobile.jpg" alt="hero image" class="w-full h-auto">
      </div>

      <div
        class="relative z-10 px-8 py-16 text-center md:text-left md:px-20 md:max-w-xl mx-auto md:flex-1 md:flex md:flex-col md:justify-center">

        <h1 class="text-4xl md:text-6xl uppercase tracking-[0.2em] leading-tight mb-6">
          <span class="font-light text-pink-400 block">We're</span>
          <span class="font-semibold text-gray-900 block">Coming Soon</span>
        </h1>

        <p class="text-pink-400 font-normal leading-relaxed mb-10 text-sm md:text-base">
          Hello fellow shoppers! We're currently building our new fashion store.
          Add your email below to stay up-to-date with announcements and our launch deals.
        </p>

      <form id="form" class="relative md:mr-10" novalidate>
        <div class="relative">
          <label for="email" class="sr-only">Email Address</label>

          <input id="email" type="email" placeholder="Email Address" required
            class="w-full px-6 py-4 bg-transparent border border-pink-400/50 rounded-full text-gray-900 placeholder:text-pink-400 outline-none focus:border-red-500 transition-colors">

          <img id="icon-error" class="hidden absolute top-1/2 right-24 -translate-y-1/2 w-3 h-6" src="images/icon-error.svg"
            alt="error icon">

          <button type="submit"
            style="right: -1rem;
            z-index: 2px;
            cursor: pointer;"

            class="z-20 absolute top-0 h-full w-24 rounded-full bg-gradient-2 flex items-center justify-center shadow-lg hover:bg-white hover:opacity-90 transition-colors">
            <img src="images/icon-arrow.svg" alt="submit arrow">
          </button>
        </div>

        <p id="text-error" class="hidden text-red-500 text-xs text-left px-6 mt-2 font-semibold">
          Please provide a valid email address
        </p>
      </form>

      </div>
    </div>

    <div class="hidden md:block md:w-5/12 h-full">
      <img src="images/hero-desktop.jpg" alt="fashion model" class="w-full h-full object-cover">
    </div>

  </main>
<script src="script.js"></script>
</body>
</html>
